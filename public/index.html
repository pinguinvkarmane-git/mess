<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f3ec">
    <title>Company Messenger</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell" aria-live="polite">
      <aside class="sidebar" aria-label="Каналы">
        <div class="brand">
          <img src="/brand-mark.svg" alt="" width="38" height="38">
          <div>
            <strong>Company Messenger</strong>
            <span>внутренний чат</span>
          </div>
        </div>

        <button class="new-message-button" id="focusComposer" type="button">
          <span aria-hidden="true">✎</span>
          <span>Новое сообщение</span>
        </button>

        <div class="section-label">Каналы</div>
        <nav class="channel-list" id="channelList"></nav>
      </aside>

      <main class="chat-panel">
        <header class="chat-header">
          <div>
            <span class="eyebrow" id="channelEyebrow">Канал</span>
            <h1 id="channelTitle">Общий</h1>
            <p id="channelDescription">Новости, быстрые вопросы и общие обсуждения</p>
          </div>
          <div class="header-actions">
            <span class="connection-status" id="connectionStatus">не подключено</span>
            <button class="icon-button" id="profileButton" type="button" title="Профиль" aria-label="Профиль">
              <span aria-hidden="true">☰</span>
            </button>
          </div>
        </header>

        <section class="message-list" id="messageList" aria-label="Сообщения"></section>

        <div class="typing-line" id="typingLine" aria-live="polite"></div>

        <form class="composer" id="composer">
          <textarea id="messageInput" name="message" rows="1" maxlength="2000" placeholder="Напишите сообщение..." aria-label="Текст сообщения"></textarea>
          <button class="send-button" type="submit" title="Отправить" aria-label="Отправить">
            <span aria-hidden="true">➤</span>
          </button>
        </form>
      </main>

      <aside class="details-panel" aria-label="Сведения">
        <section class="profile-summary">
          <div class="avatar" id="profileAvatar">CM</div>
          <div>
            <strong id="profileName">Вы не вошли</strong>
            <span id="profileDepartment">Откройте профиль</span>
          </div>
        </section>

        <section>
          <div class="section-label">Онлайн в канале</div>
          <div class="online-list" id="onlineList"></div>
        </section>

        <section>
          <div class="section-label">Быстрые действия</div>
          <div class="quick-actions">
            <button type="button" id="copyLinkButton">Скопировать ссылку</button>
            <button type="button" id="logoutButton">Выйти</button>
          </div>
        </section>
      </aside>
    </div>

    <div class="modal-backdrop is-visible" id="identityModal">
      <form class="identity-dialog" id="identityForm">
        <img src="/brand-mark.svg" alt="" width="52" height="52">
        <h2>Войти в чат компании</h2>
        <label>
          <span>Имя</span>
          <input id="nameInput" name="name" autocomplete="name" maxlength="48" required placeholder="Например, Анна">
        </label>
        <label>
          <span>Отдел</span>
          <input id="departmentInput" name="department" maxlength="64" placeholder="Например, продажи">
        </label>
        <label id="companyCodeLabel" class="is-hidden">
          <span>Код доступа</span>
          <input id="companyCodeInput" name="companyCode" autocomplete="off" placeholder="Код компании">
        </label>
        <p class="form-error" id="formError"></p>
        <button type="submit">Войти</button>
      </form>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
